<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>BrandSutra | Autonomous AI Marketing & Website Intelligence Platform</title>
    <meta name="title" content="BrandSutra | Autonomous AI Marketing & Website Intelligence Platform" />
    <meta name="description" content="BrandSutra orchestrates 10 specialized AI agents to automate multi-channel market research, competitive intelligence, content strategy, and website audits for B2B enterprises." />
    <meta name="keywords" content="AI marketing platform, autonomous agents, website intelligence, B2B content marketing, SEO auditing, AI copywriting, marketing automation" />
    <meta name="author" content="BrandSutra Inc." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="canonical" href="https://brandsutra.ai" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brandsutra.ai" />
    <meta property="og:title" content="BrandSutra | Autonomous AI Marketing & Website Intelligence Platform" />
    <meta property="og:description" content="Orchestrate 10 specialized AI agents across market research, strategy, content generation, and domain structure audits." />
    <meta property="og:image" content="https://brandsutra.ai/og-cover.png" />
    <meta property="og:site_name" content="BrandSutra AI" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://brandsutra.ai" />
    <meta name="twitter:title" content="BrandSutra | Autonomous AI Marketing Engine" />
    <meta name="twitter:description" content="Autonomous 10-agent B2B marketing engine and domain intelligence audits." />
    <meta name="twitter:image" content="https://brandsutra.ai/og-cover.png" />

    <!-- Fonts & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "BrandSutra",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Autonomous multi-agent marketing operations and website intelligence audit platform for enterprise teams."
      }
    </script>
  </head>
  <body className="antialiased bg-canvas text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
